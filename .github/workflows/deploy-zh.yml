name: Deploy zh-TW Docker Image to ktwserver

# 觸發條件：push 到 main 且有 .cpp/.h 或 Dockerfile 變更
on:
  push:
    branches: [main]
    paths:
      - 'fincept-qt/src/**'
      - 'fincept-qt/translations/**'
      - 'Dockerfile.zh-build'
      - 'docker-entrypoint-zh.sh'
  workflow_dispatch: # 手動觸發

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Build & Deploy on ktwserver
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 連接 Tailscale VPN
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci

      - name: 等待 Tailscale 路由就緒
        run: |
          echo "等待 Tailscale 路由建立..."
          sleep 10
          tailscale status
          echo "測試連線到 ktwserver..."
          tailscale ping --c 3 ${{ secrets.KTWSERVER_TAILSCALE_IP }} || echo "ping 超時，但繼續嘗試 SSH"

      - name: SSH 到 ktwserver 執行完整部署流程
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.KTWSERVER_TAILSCALE_IP }}
          username: ${{ secrets.KTWSERVER_USER }}
          key: ${{ secrets.KTWSERVER_SSH_KEY }}
          port: 22
          command_timeout: 50m
          script: |
            set -e
            echo "═══════════════════════════════════════════════════"
            echo "  Fincept Terminal zh-TW — 自動部署"
            echo "  時間: $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S')"
            echo "═══════════════════════════════════════════════════"

            cd /home/ktwserver/ktw-projects/fincept-terminal-zh

            # 1. 偵測 C++ 原始碼變更（比對 git pull 前後的 SHA-256）
            echo "[1/5] 拉取最新程式碼..."
            OLD_SRC_HASH=$(find fincept-qt/src -name '*.cpp' -o -name '*.h' -o -name '*.ui' 2>/dev/null | sort | xargs sha256sum 2>/dev/null | sha256sum | cut -d' ' -f1)
            OLD_DOCKER_HASH=$(sha256sum Dockerfile.zh-build 2>/dev/null | cut -d' ' -f1 || echo "none")
            OLD_TS_HASH=$(sha256sum fincept-qt/translations/fincept_zh_TW.ts 2>/dev/null | cut -d' ' -f1 || echo "none")
            git fetch origin main
            git reset --hard origin/main
            NEW_SRC_HASH=$(find fincept-qt/src -name '*.cpp' -o -name '*.h' -o -name '*.ui' 2>/dev/null | sort | xargs sha256sum 2>/dev/null | sha256sum | cut -d' ' -f1)
            NEW_DOCKER_HASH=$(sha256sum Dockerfile.zh-build 2>/dev/null | cut -d' ' -f1 || echo "none")
            NEW_TS_HASH=$(sha256sum fincept-qt/translations/fincept_zh_TW.ts 2>/dev/null | cut -d' ' -f1 || echo "none")
            echo "✅ 目前 commit: $(git log --oneline -1)"

            # 2. 條件式建構 — 只在 C++ 原始碼或 Dockerfile 變更時重建
            NEED_BUILD=false
            if [ "$OLD_SRC_HASH" != "$NEW_SRC_HASH" ]; then
              echo "[2/5] ⚡ C++ 原始碼有變更，需要重建 image"
              NEED_BUILD=true
            elif [ "$OLD_DOCKER_HASH" != "$NEW_DOCKER_HASH" ]; then
              echo "[2/5] ⚡ Dockerfile 有變更，需要重建 image"
              NEED_BUILD=true
            elif [ "$OLD_TS_HASH" != "$NEW_TS_HASH" ]; then
              echo "[2/5] ⚡ 翻譯檔有變更，需要重建 image（重新編譯 .ts → .qm）"
              NEED_BUILD=true
            elif ! docker image inspect ktw/fincept-terminal:zh-latest >/dev/null 2>&1; then
              echo "[2/5] ⚡ Image 不存在，需要首次建構"
              NEED_BUILD=true
            else
              echo "[2/5] ⏭️ C++ 原始碼、Dockerfile 與翻譯檔均未變更，跳過建構（省 ~35 分鐘）"
            fi

            if [ "$NEED_BUILD" = "true" ]; then
              docker build \
                -f Dockerfile.zh-build \
                --tag ktw/fincept-terminal:zh-latest \
                --tag ktw/fincept-terminal:zh-$(git rev-parse --short HEAD) \
                .
              # 🔴 Build 後驗證 — 確認 FinceptTerminal 二進位存在
              if ! docker run --rm --entrypoint='' ktw/fincept-terminal:zh-latest \
                test -f /opt/fincept/bin/FinceptTerminal; then
                echo "❌ 致命錯誤: 新 image 缺少 FinceptTerminal 二進位檔！" >&2
                echo "   回滾 zh-latest tag 到上一版..." >&2
                PREV_TAG=$(docker images ktw/fincept-terminal --format '{{.Tag}}' | grep '^zh-' | grep -v latest | head -1)
                if [ -n "$PREV_TAG" ]; then
                  docker tag ktw/fincept-terminal:$PREV_TAG ktw/fincept-terminal:zh-latest
                  echo "⚠️ 已回滾至 $PREV_TAG"
                fi
                exit 1
              fi
              echo "✅ Image 建構完成（FinceptTerminal 驗證通過）"
            fi

            # 3. 停止並移除舊的租戶容器
            echo "[3/5] 停止舊容器..."
            CONTAINERS=$(docker ps -q --filter "label=ktw.pool=terminal" 2>/dev/null || true)
            if [ -n "$CONTAINERS" ]; then
              docker stop $CONTAINERS || true
              docker rm $CONTAINERS || true
              echo "✅ 已停止 $(echo $CONTAINERS | wc -w) 個舊容器"
            else
              echo "ℹ️ 無運行中的容器"
            fi

            # 4. 重啟 Pool Manager（systemd 服務，讓它用新 image）
            echo "[4/5] 重啟 Pool Manager..."
            sudo systemctl restart fincept-pool-manager
            echo "✅ Pool Manager 已重啟"

            # 5. 清理舊 image（保留最新 2 個 tag）
            echo "[5/5] 清理舊 image..."
            docker image prune -f --filter "label=ktw.pool=terminal" 2>/dev/null || true
            echo "✅ 清理完成"

            echo ""
            echo "═══════════════════════════════════════════════════"
            echo "  ✅ 部署完成！"
            echo "  新 image: ktw/fincept-terminal:zh-latest"
            echo "  下次租戶存取 Fincept 時會自動使用新 image"
            echo "═══════════════════════════════════════════════════"
